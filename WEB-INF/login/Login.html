<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width">
		<title>ログイン</title>
		<link rel="stylesheet" href="../css/Style3.css">
	</head>
	<body>
		<button type="button" onclick="location.href='../'">トップページに戻る</button>
		<h1>ワンタイムパスワードを入力</h1>

			<form id="passwordForm" action="./" method="post">
				<input id="password" type="password" name="password" title="半角英数字16文字" pattern="[a-zA-Z0-9]{16}">

			</form>
		</div>
	</body>
