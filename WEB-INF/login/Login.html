<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width">
		<title>Sign In</title>
		<link rel="stylesheet" href="../css/Style3.css">
	</head>
	<body>
		<button type="button" onclick="location.href='../'">Top Page</button>
		<h1>Enter the One Time Password</h1>
		<div class="div2">
			<form id="passwordForm" action="./" method="post">
				<input id="password" type="password" name="password" title="16 characters" pattern="[a-zA-Z0-9]{16}">
				<button type="submit">Sign In</button>
			</form>
		</div>
	</body>
</html>
